org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true

# -----------------------------------------------------------------------------
# Mod metadata - referenced from build.gradle and neoforge.mods.toml
# -----------------------------------------------------------------------------
mod_id=flattsthings
mod_name=Flatts's Things
mod_version=0.5.0
mod_license=MIT
mod_group_id=com.flatts.flattsthings
mod_authors=Flatts3000
mod_description=A grab bag of blocks, tools and small features that vanilla Minecraft never shipped. Each addition stands on its own - take the whole set or none of it, nothing here is a tech tree.

# -----------------------------------------------------------------------------
# Minecraft / NeoForge versions (MC 26.1 - matches the recompile / productive-frogs 2.x line)
# -----------------------------------------------------------------------------
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neoforge_version=26.1.2.76
neoforge_loader_version_range=[4,)

# -----------------------------------------------------------------------------
# Publishing
# -----------------------------------------------------------------------------
# The CurseForge project's numeric id, from the Authors Console URL. Its presence is what registers
# the real publish task; without it `./gradlew publishCurseForge` is a stub that explains itself.
# The API TOKEN is never here - it comes from a gitignored .env, an env var, or a gradle property.
curseForgeProjectId=1683375

# Dev-only mods, on the CLIENT RUN ONLY - see build.gradle. Never compiled against and never a
# published dependency: this mod has no JEI or Jade integration code, they are here so a human
# looking at the game can see recipes and block tooltips the way a player in a pack would.
# 29.20.0.53 is the NEWEST JEI that accepts NeoForge 26.1.2.76: 29.20.0.54 raised its floor to
# 26.1.2.81. Bumping this without checking that floor breaks the dev client with a dependency error
# rather than anything to do with this mod.
jei_version=29.20.0.53
jade_version=26.1.10+neoforge
