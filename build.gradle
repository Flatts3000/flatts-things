plugins {
    id 'java'
    // JaCoCo instruments the JUnit layer directly. The GameTests run in their own server JVM and
    // need the agent attached by hand - see the gameTestServer run block and `coverageReport`.
    id 'jacoco'
    id 'net.neoforged.moddev' version '2.0.141'
}

base {
    // MC version in the artifact name (the house convention across these repos), so the
    // jar is unmistakable: flattsthings-26.1.2-0.1.0.jar
    archivesName = "${mod_id}-${minecraft_version}"
}

group = mod_group_id
version = mod_version

// The JaCoCo agent as a plain dependency, so a run task can point -javaagent at a real file. The
// plugin's own internal configuration is not addressable from a moddev run block.
configurations {
    jacocoRuntimeAgent
}

/**
 * What no coverage report counts.
 *
 * <p>Only the gametest package. It is test code that lives under src/main/java because GameTest
 * registration requires it, so counting it would pad the figure with tests testing themselves.
 */
ext.COVERAGE_EXCLUDES = [
    'com/flatts/flattsthings/gametest/**',
]

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        // moddev 2.0+ split the old data() run into clientData()/serverData().
        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id,
                                    '--all',
                                    '--output', file('src/generated/resources').absolutePath,
                                    '--existing', file('src/main/resources').absolutePath
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', mod_id,
                                    '--all',
                                    '--output', file('src/generated/resources').absolutePath,
                                    '--existing', file('src/main/resources').absolutePath
        }
        // Headless server that runs registered GameTests on boot, non-zero exit on failure.
        // Invoke via `./gradlew runGameTestServer`. moddev 2.0.141 has no gameTestServer()
        // convenience method, so set the type directly.
        gameTestServer {
            type.set('gameTestServer')
            // Run one test, or a group, instead of the whole suite:
            //   ./gradlew runGameTestServer -Ptests=flattsthings:a_player_presses_the_player_plate
            //   ./gradlew runGameTestServer -Ptests=flattsthings:every_*
            // Vanilla's own selector - a namespaced id with wildcards - passed through as a program
            // argument. It has to be wired here rather than reached with Gradle's `--args`, which a
            // moddev run does not forward to the game.
            if (project.hasProperty('tests')) {
                programArguments.addAll '--tests', project.property('tests').toString()
            }
            // COVERAGE FOR THE LAYER THAT ACTUALLY PROVES THIS MOD. GameTests run in their own
            // server JVM, so the `test` task's JaCoCo sees none of them - reading that report alone
            // says PlayerPressurePlateBlock is at 0% when every branch in it has an in-world test.
            // Opt in with -PgameTestCoverage so a normal run is neither slowed nor altered.
            if (project.hasProperty('gameTestCoverage')) {
                // The PROVIDER is handed over unresolved. Calling .get() here would resolve the
                // agent configuration during the configuration phase, so every task in the build
                // would pay for dependency resolution.
                jvmArguments.add(providers.provider {
                    def agent = configurations.jacocoRuntimeAgent.singleFile
                    def out = project.layout.buildDirectory.get().asFile
                    // JaCoCo separates its own options with commas and equals signs, so a path
                    // containing either is misparsed rather than rejected - it would silently write
                    // the exec file elsewhere and report a number built from nothing.
                    [agent.toString(), out.toString()].each { path ->
                        if (path.contains(',')) {
                            throw new GradleException(
                                "JaCoCo cannot take a path containing a comma: ${path}")
                        }
                    }
                    "-javaagent:${agent}=destfile=${out}/jacoco/gameTest.exec," +
                        "append=false,includes=com.flatts.flattsthings.*"
                })
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // moddev's JUnit integration: tests under src/test/java run against a real, loaded mod
    // context (registries populated, tags resolvable) without booting a full server.
    // Enabled from day one so pure logic has somewhere to go that is not a GameTest.
    unitTest {
        enable()
        testedMod = mods.named("${mod_id}").get()
    }
}

dependencies {
    jacocoRuntimeAgent "org.jacoco:org.jacoco.agent:${jacoco.toolVersion}:runtime"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    finalizedBy tasks.named('jacocoTestReport')
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        // The SAME exclusion as coverageReport, so the two reports are measured over the same
        // classes and their numbers can be compared.
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: COVERAGE_EXCLUDES)
        }))
    }
}

/**
 * THE NUMBER THAT MEANS SOMETHING: both layers at once.
 *
 * <p>Neither half is the truth alone. `jacocoTestReport` sees only the JUnit tests and reports the
 * block package at nearly nothing, when almost all of it has thorough in-world coverage.
 * `gameTest.exec` sees only the GameTests and misses the pure logic the unit layer exists for.
 *
 * <p>Run it as: {@code ./gradlew test runGameTestServer -PgameTestCoverage coverageReport}
 */
tasks.register('coverageReport', JacocoReport) {
    group = 'verification'
    description = 'Merged coverage across the JUnit layer and the in-world GameTests.'
    dependsOn tasks.named('classes')
    // ORDERING, not just dependency. Gradle does not honour command-line order for tasks with no
    // declared relationship, so the report could otherwise run before either exec file was written.
    mustRunAfter tasks.named('test'), tasks.named('runGameTestServer')

    executionData.setFrom(files(
        project.layout.buildDirectory.file('jacoco/test.exec'),
        project.layout.buildDirectory.file('jacoco/gameTest.exec')
    ).filter { it.exists() })
    doFirst {
        File gameTestExec = project.layout.buildDirectory.file('jacoco/gameTest.exec').get().asFile
        // A LEFTOVER FILE WOULD REPORT LAST WEEK'S RUN AS THIS ONE'S. `append=false` truncates it
        // only when the agent actually attaches, so without -PgameTestCoverage it simply survives
        // from an earlier instrumented run and gets merged in silently - a stale number that looks
        // exactly like a fresh one.
        if (!project.hasProperty('gameTestCoverage') && gameTestExec.exists()) {
            throw new GradleException(
                "build/jacoco/gameTest.exec is left over from an earlier instrumented run and this "
                    + "one did not produce it. Merging it would report stale GameTest coverage as "
                    + "current. Re-run with -PgameTestCoverage, or delete the file.")
        }
    }
    sourceDirectories.setFrom(files('src/main/java'))
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.files.collect {
        fileTree(dir: it, exclude: COVERAGE_EXCLUDES)
    }))
    reports {
        xml.required = true
        html.required = true
    }
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

tasks.processResources {
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_version', mod_version
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description
    inputs.property 'minecraft_version_range', minecraft_version_range
    inputs.property 'neoforge_loader_version_range', neoforge_loader_version_range
    inputs.property 'neoforge_version', neoforge_version

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand(
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            mod_description: mod_description,
            minecraft_version_range: minecraft_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            neoforge_version: neoforge_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_name,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}

// Aggregate prepare task for the interactive moddev runs. `gradle clean` wipes
// build/moddev/*RunVmArgs.txt; IntelliJ's generated run configs reference those at
// launch, so regenerate them after a clean. Invoke: `./gradlew prepareAllRuns`.
tasks.register('prepareAllRuns') {
    group = 'neoforge runs'
    description = 'Regenerate VM args / classpath files for the interactive moddev runs.'
    dependsOn 'prepareClientRun',
              'prepareServerRun',
              'prepareGameTestServerRun'
}
