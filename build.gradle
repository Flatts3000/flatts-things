plugins {
    id 'java'
    // JaCoCo instruments the JUnit layer directly. The GameTests run in their own server JVM and
    // need the agent attached by hand - see the gameTestServer run block and `coverageReport`.
    id 'jacoco'
    id 'net.neoforged.moddev' version '2.0.141'
    // CurseForgeGradle wraps the upload API so `./gradlew publishCurseForge` pushes a new file to
    // the project page. The token comes from .env (gitignored), an env var, or a gradle property,
    // never from a tracked file. 1.2.30 matches the 26.1 / Java 25 line; spawn-detective pins
    // 1.1.26 on its 1.21.1 branch because 1.2.x needs a Java 25 Gradle daemon.
    id 'net.darkhax.curseforgegradle' version '1.2.30'
}

base {
    // MC version in the artifact name (the house convention across these repos), so the
    // jar is unmistakable: flattsthings-26.1.2-0.1.0.jar
    archivesName = "${mod_id}-${minecraft_version}"
}

group = mod_group_id
version = mod_version

// The JaCoCo agent as a plain dependency, so a run task can point -javaagent at a real file. The
// plugin's own internal configuration is not addressable from a moddev run block.
configurations {
    jacocoRuntimeAgent
}

/**
 * What no coverage report counts.
 *
 * <p>Only the gametest package. It is test code that lives under src/main/java because GameTest
 * registration requires it, so counting it would pad the figure with tests testing themselves.
 */
ext.COVERAGE_EXCLUDES = [
    'com/flatts/flattsthings/gametest/**',
]

/**
 * What the GATE additionally ignores, and why it is not the same list as the report's.
 *
 * <p>`client/**` never loads on the server the tests run on, so no GameTest and no JUnit test can
 * reach a line of it however well written. Counting it in a hard floor does not measure test
 * quality, it measures how much client code exists, and a gate that fails for reasons nobody can
 * act on is a gate people learn to bypass.
 *
 * <p><b>The REPORT still counts it, deliberately.</b> Hiding client code there would make the
 * headline number look better while removing the evidence that those lines have no automated
 * coverage at all. So the report is the honest figure and the gate is the actionable one, and the
 * gap between them is the client surface. Recompile draws the same line and argues the subtraction
 * in a doc rather than in its build file.
 */
ext.COVERAGE_GATE_EXCLUDES = COVERAGE_EXCLUDES + [
    'com/flatts/flattsthings/client/**',
]

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

/**
 * JEI and Jade, downloaded into run/mods for the dev client to pick up.
 *
 * <p>NOT a dependency, and the distinction is the whole design. moddev 2.0.141 removed the per-run
 * additional classpath - it fails with "there is no additional classpath anymore for Minecraft
 * 26.1.2" and points at runtimeOnly, which would put two client mods on the runtime classpath of
 * every run and of `test`, and make both CI jobs resolve them over the network for nothing.
 *
 * <p>run/mods is gitignored and is already how devbridge gets in, so this follows a pattern the
 * repo has rather than inventing a second one. It cannot leak into the published jar, the GameTest
 * server does not pay for it, and CI never runs this task because CI never runs the client.
 *
 * <p>This mod compiles against NEITHER and has no integration code for either. They are here so a
 * human at the keyboard can see what a player in a pack sees - JEI shows whether the plate recipes
 * actually loaded, which is exactly what the config's recipe condition changes and the one thing no
 * headless test can look at, and Jade names the block under the crosshair.
 *
 * <p>Skips anything already downloaded, so the client does not wait on the network to start and
 * works offline once primed. Delete run/mods/*.jar to force a refetch after a version bump.
 */
def fetchDevMods = tasks.register('fetchDevMods') {
    group = 'flattsthings'
    description = 'Download JEI and Jade into run/mods for the dev client (not a dependency).'

    def targets = [
        "jei-${minecraft_version}-neoforge-${jei_version}.jar":
            "https://maven.blamejared.com/mezz/jei/jei-${minecraft_version}-neoforge/${jei_version}/jei-${minecraft_version}-neoforge-${jei_version}.jar",
        "jade-${jade_version}.jar":
            "https://api.modrinth.com/maven/maven/modrinth/jade/${URLEncoder.encode(jade_version.toString(), 'UTF-8')}/jade-${URLEncoder.encode(jade_version.toString(), 'UTF-8')}.jar",
    ]
    def modsDir = layout.projectDirectory.dir('run/mods').asFile
    outputs.upToDateWhen { targets.keySet().every { new File(modsDir, it).exists() } }

    doLast {
        modsDir.mkdirs()
        targets.each { name, url ->
            def target = new File(modsDir, name)
            if (target.exists()) {
                logger.lifecycle("dev mod already present: ${name}")
                return
            }
            // Downloads to a temp file and renames, so an interrupted fetch cannot leave a
            // truncated jar in the mods folder - which FML reports as a corrupt mod rather than as
            // a failed download.
            def partial = new File(modsDir, name + '.part')
            logger.lifecycle("fetching dev mod: ${name}")
            new URI(url).toURL().withInputStream { input ->
                partial.withOutputStream { output -> output << input }
            }
            if (!partial.renameTo(target)) {
                throw new GradleException("could not move ${partial} into place")
            }
        }
    }
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            // devbridge (its own repo, F:\devbridge): lets tooling drive this client from outside -
            // run commands in a singleplayer world and take screenshots. Inert without this
            // property, and the jar lives in run/mods rather than being a dependency, so it can
            // never ship.
            //
            // 8610 is CLAIMED for this repo in ~/.claude/port_registry.yaml, deliberately not
            // devbridge's own default. There is no default port on either side precisely because a
            // shared one once had Trashlands' verifier connect to Recompile's dev client and report
            // a clean pass about the wrong world. Note the registry cannot detect a clash here: the
            // ports helper enumerates IPv4 only and devbridge binds getLoopbackAddress(), which is
            // ::1 on this machine, so the registry reports the port free while a game holds it.
            // Anything that must be sure asks what answered, via `gamebridge ping`.
            systemProperty 'devbridge.port', '8610'
            // Never grab the mouse, so alt-tabbing during an unattended shoot cannot spin the
            // camera mid-capture.
            systemProperty 'devbridge.lockInput', 'true'
            // Boot straight into a world instead of stopping at the title screen. Vanilla's own
            // launch argument, not a mod feature. `--args` on the Gradle task does NOT do this: a
            // moddev run reads it as a main class and the launch dies before Minecraft starts.
            //
            // THE WORLD MUST ALREADY EXIST AND ITS NAME MUST NOT CONTAIN A SPACE. Quick play does
            // not create a missing world - it shows a "could not find world" SCREEN, which logs
            // nothing, so the symptom is a client sitting at a menu and a socket that never opens.
            // And moddev quotes any argument containing a space into
            // build/moddev/clientRunProgramArgs.txt, so 'New World' would reach the game as
            // '"New World"', quotes included, matching no directory on disk.
            //
            // `python tools/make_dev_world.py` builds it.
            programArguments.addAll '--quickPlaySingleplayer', 'devworld'
            // Force the window size, because a screenshot IS the framebuffer: devbridge captures at
            // whatever the window happens to be, and the default 854x480 is unusable for comparing
            // fourteen textures. Fixed dimensions also mean every shot crops identically.
            programArguments.addAll '--width', '1920', '--height', '1080'

            // JEI and Jade, fetched into run/mods rather than put on a classpath. See the
            // fetchDevMods task; taskBefore is what scopes them to this run.
            taskBefore(fetchDevMods)
        }
        server {
            server()
        }
        // moddev 2.0+ split the old data() run into clientData()/serverData().
        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id,
                                    '--all',
                                    '--output', file('src/generated/resources').absolutePath,
                                    '--existing', file('src/main/resources').absolutePath
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', mod_id,
                                    '--all',
                                    '--output', file('src/generated/resources').absolutePath,
                                    '--existing', file('src/main/resources').absolutePath
        }
        // Headless server that runs registered GameTests on boot, non-zero exit on failure.
        // Invoke via `./gradlew runGameTestServer`. moddev 2.0.141 has no gameTestServer()
        // convenience method, so set the type directly.
        gameTestServer {
            type.set('gameTestServer')
            // ITS OWN DIRECTORY, so it never sees run/mods. The dev-only mods there are for a human
            // looking at the game; this is the layer CI gates on, and it has no use for them. That
            // is not hypothetical tidiness - JEI's first version here demanded a newer NeoForge than
            // this project pins, and took `runGameTestServer` down with a dependency error that had
            // nothing to do with the mod under test. A test layer should not be breakable by a tool
            // that exists to look at something else.
            gameDirectory.set(file('run/gametest'))
            // Run one test, or a group, instead of the whole suite:
            //   ./gradlew runGameTestServer -Ptests=flattsthings:a_player_presses_the_player_plate
            //   ./gradlew runGameTestServer -Ptests=flattsthings:every_*
            // Vanilla's own selector - a namespaced id with wildcards - passed through as a program
            // argument. It has to be wired here rather than reached with Gradle's `--args`, which a
            // moddev run does not forward to the game.
            if (project.hasProperty('tests')) {
                programArguments.addAll '--tests', project.property('tests').toString()
            }
            // COVERAGE FOR THE LAYER THAT ACTUALLY PROVES THIS MOD. GameTests run in their own
            // server JVM, so the `test` task's JaCoCo sees none of them - reading that report alone
            // says PlayerPressurePlateBlock is at 0% when every branch in it has an in-world test.
            // Opt in with -PgameTestCoverage so a normal run is neither slowed nor altered.
            if (project.hasProperty('gameTestCoverage')) {
                // The PROVIDER is handed over unresolved. Calling .get() here would resolve the
                // agent configuration during the configuration phase, so every task in the build
                // would pay for dependency resolution.
                jvmArguments.add(providers.provider {
                    def agent = configurations.jacocoRuntimeAgent.singleFile
                    def out = project.layout.buildDirectory.get().asFile
                    // JaCoCo separates its own options with commas and equals signs, so a path
                    // containing either is misparsed rather than rejected - it would silently write
                    // the exec file elsewhere and report a number built from nothing.
                    [agent.toString(), out.toString()].each { path ->
                        if (path.contains(',')) {
                            throw new GradleException(
                                "JaCoCo cannot take a path containing a comma: ${path}")
                        }
                    }
                    "-javaagent:${agent}=destfile=${out}/jacoco/gameTest.exec," +
                        "append=false,includes=com.flatts.flattsthings.*"
                })
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // moddev's JUnit integration: tests under src/test/java run against a real, loaded mod
    // context (registries populated, tags resolvable) without booting a full server.
    // Enabled from day one so pure logic has somewhere to go that is not a GameTest.
    unitTest {
        enable()
        testedMod = mods.named("${mod_id}").get()
    }
}

dependencies {
    jacocoRuntimeAgent "org.jacoco:org.jacoco.agent:${jacoco.toolVersion}:runtime"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    finalizedBy tasks.named('jacocoTestReport')
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        // The SAME exclusion as coverageReport, so the two reports are measured over the same
        // classes and their numbers can be compared.
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: COVERAGE_EXCLUDES)
        }))
    }
}


/**
 * The staleness and emptiness guards for {@code coverageReport}, as their own task.
 *
 * <p>THEY CANNOT LIVE IN {@code coverageReport.doFirst}, which is where they started. JaCoCo marks
 * {@code executionData} {@code @SkipWhenEmpty}, so with no exec files at all the report task is
 * skipped NO-SOURCE, its {@code doFirst} never runs, and the build exits 0 having measured nothing.
 * A separate task always runs and can always fail.
 *
 * <p>THE STALENESS CHECK ASKS WHETHER THE PRODUCING TASK RAN IN THIS BUILD, not whether a flag was
 * passed. The first version only fired when {@code -PgameTestCoverage} was ABSENT, which left the
 * exact hole it existed to close: run the GameTests, watch one fail, fix the code, then run
 * {@code test coverageReport -PgameTestCoverage} without the GameTests - and the pre-fix exec file
 * is merged and reported as current. Its own error text even advised passing the flag that disabled
 * it. Both halves are covered now; the JUnit half never had a guard at all.
 */
tasks.register('verifyCoverageInputs') {
    group = 'verification'
    description = 'Fail if coverage data is missing entirely, or left over from an earlier build.'
    mustRunAfter tasks.named('test'), tasks.named('runGameTestServer')
    doLast {
        def graph = gradle.taskGraph
        def checks = [
            [tasks.named('test').get(),               'jacoco/test.exec',     'test'],
            [tasks.named('runGameTestServer').get(),  'jacoco/gameTest.exec', 'runGameTestServer -PgameTestCoverage'],
        ]
        boolean any = false
        checks.each { producer, relative, how ->
            File exec = project.layout.buildDirectory.file(relative).get().asFile
            if (!exec.exists()) {
                return
            }
            any = true
            if (!graph.hasTask(producer)) {
                throw new GradleException(
                    "build/${relative} is left over from an earlier build and ${producer.name} did "
                        + "not run in this one. Merging it would report stale coverage as current. "
                        + "Run `${how}` in the same invocation, or delete the file.")
            }
        }
        if (!any) {
            throw new GradleException(
                "no coverage data was produced. coverageReport would be skipped NO-SOURCE and the "
                    + "build would pass having measured nothing. Run: "
                    + "./gradlew test runGameTestServer -PgameTestCoverage coverageReport")
        }
    }
}

/**
 * THE NUMBER THAT MEANS SOMETHING: both layers at once.
 *
 * <p>Neither half is the truth alone. `jacocoTestReport` sees only the JUnit tests and reports the
 * block package at nearly nothing, when almost all of it has thorough in-world coverage.
 * `gameTest.exec` sees only the GameTests and misses the pure logic the unit layer exists for.
 *
 * <p>Run it as: {@code ./gradlew test runGameTestServer -PgameTestCoverage coverageReport}
 */
tasks.register('coverageReport', JacocoReport) {
    group = 'verification'
    description = 'Merged coverage across the JUnit layer and the in-world GameTests.'
    dependsOn tasks.named('classes')
    // ORDERING, not just dependency. Gradle does not honour command-line order for tasks with no
    // declared relationship, so the report could otherwise run before either exec file was written.
    mustRunAfter tasks.named('test'), tasks.named('runGameTestServer')

    dependsOn tasks.named('verifyCoverageInputs')
    executionData.setFrom(files(
        project.layout.buildDirectory.file('jacoco/test.exec'),
        project.layout.buildDirectory.file('jacoco/gameTest.exec')
    ).filter { it.exists() })
    sourceDirectories.setFrom(files('src/main/java'))
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.files.collect {
        fileTree(dir: it, exclude: COVERAGE_EXCLUDES)
    }))
    reports {
        xml.required = true
        html.required = true
    }
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

tasks.processResources {
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_version', mod_version
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description
    inputs.property 'minecraft_version_range', minecraft_version_range
    inputs.property 'neoforge_loader_version_range', neoforge_loader_version_range
    inputs.property 'neoforge_version', neoforge_version

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand(
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            mod_description: mod_description,
            minecraft_version_range: minecraft_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            neoforge_version: neoforge_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_name,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}

// Aggregate prepare task for the interactive moddev runs. `gradle clean` wipes
// build/moddev/*RunVmArgs.txt; IntelliJ's generated run configs reference those at
// launch, so regenerate them after a clean. Invoke: `./gradlew prepareAllRuns`.
tasks.register('prepareAllRuns') {
    group = 'neoforge runs'
    description = 'Regenerate VM args / classpath files for the interactive moddev runs.'
    dependsOn 'prepareClientRun',
              'prepareServerRun',
              'prepareGameTestServerRun'
}

/**
 * The 80 percent floor from the house testing rules, applied to the MERGED data.
 *
 * <p>Run in CI by the `coverage` job. Without it the figures in a PR body are a one-time local
 * measurement that no later change can visibly regress.
 */
tasks.register('coverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Fail if merged coverage drops below the floor.'
    dependsOn tasks.named('coverageReport')
    executionData.setFrom(files(
        project.layout.buildDirectory.file('jacoco/test.exec'),
        project.layout.buildDirectory.file('jacoco/gameTest.exec')
    ).filter { it.exists() })
    sourceDirectories.setFrom(files('src/main/java'))
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.files.collect {
        fileTree(dir: it, exclude: COVERAGE_GATE_EXCLUDES)
    }))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}


// ---------------------------------------------------------------------------
// CurseForge publishing. Manual: `./gradlew publishCurseForge` after a good build.
// NEVER run by CI - a release is a decision, not a push event.
// ---------------------------------------------------------------------------

def readDotEnv(File envFile) {
    def map = [:]
    if (!envFile.exists()) return map
    envFile.eachLine { line ->
        def trim = line.trim()
        if (!trim || trim.startsWith('#')) return
        def eq = trim.indexOf('=')
        if (eq <= 0) return
        def k = trim.substring(0, eq).trim()
        def v = trim.substring(eq + 1).trim().replaceAll(/^["']|["']$/, '')
        map[k] = v
    }
    return map
}

/** First hit wins: a gitignored .env at the repo root, then the environment, then a gradle property. */
def resolveCfApiToken() {
    def envMap = readDotEnv(file("${rootDir}/.env"))
    return envMap['CURSEFORGE_API_KEY'] ?: System.getenv('CURSEFORGE_API_KEY') ?: findProperty('cfApiToken')
}

/**
 * The section of CHANGELOG.md for this version, used as the file's changelog on the listing.
 *
 * <p>THE HEADING FORMAT IS LOAD-BEARING. This matches `## v<version>` literally and stops at the
 * next `## v`, so renaming a heading silently ships "Release x.y.z" as the whole changelog. The pack
 * repos extract theirs by regex for the same reason and say the same thing about it.
 */
def extractChangelogSection(File changelogFile, String version) {
    if (!changelogFile.exists()) return "Release ${version}"
    def text = changelogFile.text
    def startMarker = "## v${version}"
    def startIdx = text.indexOf(startMarker)
    if (startIdx < 0) return "Release ${version}"
    def endIdx = text.indexOf("\n## v", startIdx + startMarker.length())
    if (endIdx < 0) endIdx = text.length()
    return text.substring(startIdx, endIdx).trim()
}

// CONDITIONAL, AND THAT IS LOAD-BEARING RATHER THAN TIDY. CurseForgeGradle resolves the project id
// while CONFIGURING the task, so registering it unconditionally breaks every Gradle invocation -
// `build` included - on any clone where the id is unset. Register the real task when it is there,
// and one that explains itself when it is not.
if (findProperty('curseForgeProjectId')) {
    tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        group = 'publishing'
        description = 'Upload the built jar to CurseForge.'
        dependsOn tasks.named('build')

        apiToken = resolveCfApiToken()

        def primary = upload(findProperty('curseForgeProjectId'), tasks.jar.archiveFile)
        // Alpha for the 0.x line.
        primary.releaseType = 'alpha'
        primary.addGameVersion(minecraft_version)
        primary.addModLoader('NeoForge')
        primary.addJavaVersion('Java 25')
        // Both sides. The sensitivity is decided on the server and the block is drawn on the
        // client, so a client-only tag would have people installing it where it cannot work.
        primary.addEnvironment('Client', 'Server')
        primary.changelog = extractChangelogSection(file("${rootDir}/CHANGELOG.md"), mod_version)
        primary.changelogType = 'markdown'
        primary.displayName = "${mod_name} ${mod_version}"

        doFirst {
            if (!apiToken) {
                throw new GradleException("CURSEFORGE_API_KEY not set. Put it in .env at the repo "
                    + "root (gitignored, see .env.example), export it, or add cfApiToken to "
                    + "~/.gradle/gradle.properties.")
            }
        }
    }
} else {
    tasks.register('publishCurseForge') {
        group = 'publishing'
        description = 'Upload the built jar to CurseForge (needs curseForgeProjectId first).'
        doFirst {
            throw new GradleException('curseForgeProjectId is not set. To publish: '
                + '(1) create the CurseForge project and copy its numeric id, '
                + '(2) add curseForgeProjectId=<id> to gradle.properties, '
                + '(3) put CURSEFORGE_API_KEY=<token> in .env at the repo root.')
        }
    }
}
