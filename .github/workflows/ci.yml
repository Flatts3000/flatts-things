name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name MUST be 'build' - main branch protection requires this status check.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: flattsthings-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  # In-world GameTests - booted headless server runs each registered test in a
  # scripted plot, exits non-zero on any failure. Independent of build so the two
  # layers report separately.
  gameTest:
    name: gameTest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Run GameTest server
        run: ./gradlew runGameTestServer --stacktrace

  # The merged coverage number, gated at the 80 percent floor.
  #
  # Its own job because the merge is the whole point: `build` runs JUnit and `gameTest` runs the
  # in-world suite, and neither alone is the truth. Without this the figures quoted in a PR body are
  # a one-time local measurement that no later change can visibly regress.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # One invocation on purpose. Splitting these would trip verifyCoverageInputs, which fails when
      # an exec file is present but its producing task did not run in the same build.
      - name: Merged coverage
        run: ./gradlew test runGameTestServer -PgameTestCoverage coverageReport coverageVerification --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: build/reports/jacoco/coverageReport
          if-no-files-found: warn
          retention-days: 14

  # The Python tooling that generates every per-variant resource. Its own job rather than a step in
  # `build`, so a generator regression reports as a generator regression instead of a Gradle failure.
  tools:
    name: tools
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      # Includes the check that the committed tree still matches a fresh generation. That
      # comparison is deliberately NOT `git diff` - see the case's docstring for why byte equality
      # is the wrong question for a PNG across machines.
      - name: Test the resource generator
        run: python tools/test_generate_plates.py

      # Same job for the same reason: nothing else notices if PAIRS and the committed JSON drift,
      # and the failure is an item that is in neither the tag nor the data map.
      - name: Test the cauldron generator
        run: python tools/test_generate_cauldron.py

      - name: Test the wood cutting generator
        run: python tools/test_generate_woodcutting.py

      - name: Test the dash linter
        run: python tools/test_check_dashes.py

      # The house rule is ASCII punctuation only. Enforced here rather than trusted, the way the
      # pack repos do it.
      - name: No em-dashes or en-dashes
        run: python tools/check_dashes.py

      # Every markdown file must carry a dated status banner. Cannot check whether the content is
      # true - that is what a SCRUB pass is for - only that somebody claimed a date.
      - name: Docs carry a current status banner
        run: python tools/check_docs.py
